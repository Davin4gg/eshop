meta:
  environment: nodejs
  toolchain:
    name: npm
    version: "20"
build:
  requirements:
    - backend/
  steps:
    - cd backend && npm install
    - cd backend/public && npm install && npm run build
  skip: false
  additionalCommands: null
  artifacts:
    "*": /
run:
  scriptName: null
  scriptArguments: null
  nodeArguments: null
  command: cd backend && node server.js
  persistenceMount: /data
  containerPort: "80"
  servicePort: "80"
